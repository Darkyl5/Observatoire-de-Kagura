 Grande Ourse. Merak et Dubhe pointent vers l\u2019\xE9toile Polaire.",note:"Premier rep\xE8re que papa m\u2019a appris.",margin:"Mizar + Alcor = test de vue !",strike:["constellation","ast\xE9risme"]},{id:"c-ori",cat:"astronomie",title:"Orion le chasseur",sketch:"const:ori",text:"B\xE9telgeuse (superg\xE9ante rouge, froide en surface) et Rigel (superg\xE9ante bleue, tr\xE8s chaude) : la couleur d\u2019une \xE9toile r\xE9v\xE8le sa temp\xE9rature.",note:"M42 sous la ceinture : on voit des \xE9toiles en train de na\xEEtre. En direct. Enfin, avec 1 300 ans de retard.",margin:"rouge = ~3 500 K / bleu = >10 000 K"},{id:"c-lyr",cat:"astronomie",title:"La Lyre et V\xE9ga",sketch:"const:lyr",text:"V\xE9ga (25 ann\xE9es\u2011lumi\xE8re) fut une r\xE9f\xE9rence de magnitude. La pr\xE9cession de l\u2019axe de notre plan\xE8te la ram\xE8nera pr\xE8s du p\xF4le nord c\xE9leste dans environ 12 000 ans.",note:"\u03B5 Lyrae, la double\u2011double. Quatre \xE9toiles l\xE0 o\xF9 l\u2019\u0153il n\u2019en voit qu\u2019une."},{id:"c-cyg",cat:"astronomie",title:"Le Cygne",sketch:"const:cyg",text:"La Croix du Nord vole le long de la Voie lact\xE9e. Deneb, V\xE9ga et Alta\xEFr forment le Triangle d\u2019\xE9t\xE9.",note:"Albireo : or et bleu.",margin:"distance de Deneb : incertaine !"},{id:"c-sco",cat:"astronomie",title:"Le Scorpion",sketch:"const:sco",text:"Antar\xE8s, superg\xE9ante rouge, \xAB rivale de Mars \xBB. La constellation est travers\xE9e par l\u2019\xE9cliptique et regarde vers le centre galactique.",note:"Toujours bas sur l\u2019horizon sud, \xE0 Kumo. Pour voir sa queue en entier : aller dans le d\xE9sert du Pays du Vent."},{id:"ev-eclipse",cat:"astronomie",title:"\xC9clipse de Lune",sketch:"eclipse",text:"Quand notre plan\xE8te passe exactement entre le Soleil et la Lune, la Lune entre dans son ombre. Elle devient rouge cuivr\xE9 : notre atmosph\xE8re d\xE9vie vers elle la lumi\xE8re rouge, le bleu \xE9tant diffus\xE9 en chemin.",note:"Tous les couchers de soleil du monde, projet\xE9s d\u2019un coup sur la Lune."},{id:"ev-meteors",cat:"astronomie",title:"Pluie de m\xE9t\xE9ores",sketch:"meteor",text:"Des grains de poussi\xE8re laiss\xE9s par une com\xE8te entrent dans l\u2019atmosph\xE8re \xE0 des dizaines de km/s et s\u2019y consument vers 80 \xE0 120 km d\u2019altitude. Les tra\xEEn\xE9es semblent partir d\u2019un m\xEAme point : le radiant.",note:"Des grains de sable. Pas des \xE9toiles qui tombent.",strike:["\xE9toiles filantes","m\xE9t\xE9ores"]},{id:"ev-comet",cat:"astronomie",title:"Com\xE8te",sketch:"comet",text:"Un noyau de glace et de poussi\xE8re. En approchant du Soleil, il se sublime et forme une chevelure ; le vent solaire et la pression de la lumi\xE8re poussent les queues \xE0 l\u2019oppos\xE9 du Soleil.",note:"La queue ne suit pas la com\xE8te. Elle fuit le Soleil.",margin:"2 queues : poussi\xE8re (courbe) + ions (droite, bleue)"},{id:"ev-planet",cat:"astronomie",title:"Plan\xE8te visible",sketch:"planet",text:"Les plan\xE8tes brillent par la lumi\xE8re du Soleil qu\u2019elles r\xE9fl\xE9chissent. Elles scintillent moins que les \xE9toiles et se d\xE9placent devant les constellations au fil des jours.",note:"\xAB Plan\xE8te \xBB veut dire \xAB astre errant \xBB dans la vieille langue des astronomes."},{id:"am-horizontal",cat:"astrometrie",title:"Coordonn\xE9es horizontales",sketch:"coords",text:"Pour viser un astre depuis un lieu donn\xE9, deux angles suffisent : l\u2019azimut (direction, compt\xE9 depuis le nord vers l\u2019est) et la hauteur (angle au\u2011dessus de l\u2019horizon).",note:"Mais ces coordonn\xE9es changent \xE0 chaque minute, car notre plan\xE8te tourne.",formula:"Az \u2208 [0\xB0, 360\xB0[   h \u2208 [\u221290\xB0, 90\xB0]"},{id:"am-polaris",cat:"astrometrie",title:"Polaris donne la latitude",sketch:"polaris",text:"L\u2019\xE9toile Polaire est \xE0 moins d\u2019un degr\xE9 du p\xF4le nord c\xE9leste. Sa hauteur au\u2011dessus de l\u2019horizon est presque \xE9gale \xE0 la latitude de l\u2019observateur : environ 42\xB0 \xE0 Kumogakure, 25\xB0 seulement dans le d\xE9sert du Pays du Vent.",note:"Papa naviguait comme \xE7a : mesurer Polaris = savoir o\xF9 l\u2019on est.",formula:"h(Polaris) \u2248 \u03C6"},{id:"am-equatorial",cat:"astrometrie",title:"Coordonn\xE9es \xE9quatoriales",sketch:"coords-eq",text:"L\u2019ascension droite (\u03B1) et la d\xE9clinaison (\u03B4) sont attach\xE9es au ciel, pas au lieu : elles restent (presque) fixes. L\u2019angle horaire H = TSL \u2212 \u03B1 relie les deux syst\xE8mes.",note:"Le carnet d\u2019\xE9toiles de papa : uniquement en \u03B1, \u03B4. Maintenant je comprends pourquoi.",formula:"sin h = sin \u03B4 sin \u03C6 + cos \u03B4 cos \u03C6 cos H"},{id:"am-vega",cat:"astrometrie",title:"Mesure de V\xE9ga",sketch:"coords",text:"V\xE9ga : \u03B1 \u2248 18 h 37 min, \u03B4 \u2248 +38\xB0 47\u2032. Depuis Kumogakure (42\xB0 N), elle peut passer presque au z\xE9nith.",note:"Deuxi\xE8me mesure. Je tremble moins."},{id:"am-arcturus",cat:"astrometrie",title:"Mesure d\u2019Arcturus",sketch:"coords",text:"Arcturus : \u03B1 \u2248 14 h 16 min, \u03B4 \u2248 +19\xB0 11\u2032. G\xE9ante orang\xE9e, \xE9toile la plus brillante de l\u2019h\xE9misph\xE8re c\xE9leste nord.",note:"Suivre l\u2019arc de la queue de la Grande Ourse \u2192 Arcturus."},{id:"am-betelgeuse",cat:"astrometrie",title:"Mesure de B\xE9telgeuse",sketch:"coords",text:"B\xE9telgeuse : \u03B1 \u2248 5 h 55 min, \u03B4 \u2248 +7\xB0 24\u2032. Proche de l\u2019\xE9quateur c\xE9leste, elle se l\xE8ve presque \xE0 l\u2019est et se couche presque \xE0 l\u2019ouest.",note:"\u03B4 \u2248 0 \u2192 lever plein est. Logique, enfin."},{id:"ob-circular",cat:"astrophysique",title:"Orbite circulaire",sketch:"orbit-circle",text:"Une orbite est circulaire quand la vitesse est perpendiculaire au rayon et vaut exactement v = \u221A(GM/r). Plus lente : la plan\xE8te tombe vers une ellipse ; plus rapide : l\u2019ellipse s\u2019allonge vers l\u2019ext\xE9rieur.",note:"Tomber en permanence\u2026 et rater le sol \xE0 chaque fois.",formula:"v_circ = \u221A(GM / r)"},{id:"ob-ellipse",cat:"astrophysique",title:"Les trois lois des orbites",sketch:"orbit-ellipse",text:"1) Les orbites sont des ellipses dont l\u2019\xE9toile occupe un foyer. 2) Le rayon balaie des aires \xE9gales en des temps \xE9gaux : la plan\xE8te acc\xE9l\xE8re pr\xE8s de l\u2019\xE9toile. 3) Le carr\xE9 de la p\xE9riode est proportionnel au cube du demi\u2011grand axe.",note:"Un astronome d\u2019autrefois les a trouv\xE9es \xE0 la main, \xE0 partir des mesures d\u2019un autre, not\xE9es nuit apr\xE8s nuit pendant des ann\xE9es.",formula:"T\xB2 = 4\u03C0\xB2 a\xB3 / GM"},{id:"ob-collision",cat:"astrophysique",title:"Le p\xE9riastre",sketch:"orbit-collision",text:"Le point le plus proche de l\u2019\xE9toile s\u2019appelle le p\xE9riastre. Pour \xE9viter la collision, il faut qu\u2019il reste au\u2011dessus de la surface de l\u2019\xE9toile : c\u2019est surtout la vitesse tangentielle qui l\u2019\xE9loigne.",note:"Viser \xE0 c\xF4t\xE9. Toujours viser \xE0 c\xF4t\xE9.",strike:["plus vite","plus de c\xF4t\xE9"]},{id:"ob-capture",cat:"astrophysique",title:"Capture d\u2019une lune",sketch:"orbit-capture",text:"\xC0 deux corps, un objet qui arrive de loin repart toujours : pour qu\u2019il soit captur\xE9, il doit perdre de l\u2019\xE9nergie (frottement dans une enveloppe de gaz, collision, rencontre avec un troisi\xE8me corps). Il doit aussi rester dans la sph\xE8re de Hill de la plan\xE8te.",note:"Triton, la grande lune de Neptune, tourne \xE0 l\u2019envers. Probablement une captur\xE9e.",formula:"r_Hill \u2248 a (m / 3M)^(1/3)"},{id:"st-fusion",cat:"astrophysique",title:"La fusion stellaire",sketch:"fusion",text:"Au c\u0153ur d\u2019une \xE9toile de la s\xE9quence principale, l\u2019hydrog\xE8ne fusionne en h\xE9lium. Un peu de masse dispara\xEEt et devient \xE9nergie : c\u2019est ce qui fait briller l\u2019\xE9toile pendant des millions ou des milliards d\u2019ann\xE9es.",note:"E = mc\xB2. Le Soleil perd environ 4 millions de tonnes par seconde.",formula:"4 \xB9H \u2192 \u2074He + \xE9nergie"},{id:"st-reddwarf",cat:"astrophysique",title:"Naine rouge",sketch:"star-red",text:"Les \xE9toiles de moins d\u2019environ 0,5 masse solaire br\xFBlent leur hydrog\xE8ne tr\xE8s lentement. Leur vie d\xE9passe de loin l\u2019\xE2ge actuel de l\u2019Univers (13,8 milliards d\u2019ann\xE9es) : aucune n\u2019a encore fini sa vie.",note:"Leur mort n\u2019est qu\u2019une pr\xE9diction des mod\xE8les. Personne ne l\u2019a jamais vue."},{id:"st-whitedwarf",cat:"astrophysique",title:"Naine blanche",sketch:"star-white",text:"Une \xE9toile comme le Soleil devient g\xE9ante rouge, expulse ses couches externes (n\xE9buleuse plan\xE9taire) et laisse un c\u0153ur de la taille de notre plan\xE8te, extr\xEAmement dense, qui refroidit lentement.",note:"Une cuill\xE8re de naine blanche p\xE8serait des tonnes."},{id:"st-neutron",cat:"astrophysique",title:"\xC9toile \xE0 neutrons",sketch:"star-neutron",text:"Au\u2011del\xE0 d\u2019environ 8 masses solaires, le c\u0153ur s\u2019effondre \xE0 la fin de la vie de l\u2019\xE9toile et provoque une supernova. Il peut rester une \xE9toile \xE0 neutrons d\u2019une vingtaine de kilom\xE8tres ; si elle tourne vite et que ses faisceaux balaient notre plan\xE8te, on la voit comme un pulsar.",note:"Une ville enti\xE8re de mati\xE8re nucl\xE9aire. Qui tourne des centaines de fois par seconde, parfois."},{id:"st-blackhole",cat:"astrophysique",title:"Trou noir stellaire",sketch:"star-bh",text:"Pour les \xE9toiles les plus massives, le c\u0153ur effondr\xE9 peut devenir un trou noir : m\xEAme la lumi\xE8re ne s\u2019en \xE9chappe plus sous l\u2019horizon des \xE9v\xE9nements. La masse limite exacte d\xE9pend notamment de la composition et des pertes de masse de l\u2019\xE9toile.",note:"On ne le voit pas. On voit ce qui tombe dedans.",margin:"seuil \u2248 20\u201325 M\u2609 ? (incertain)"},{id:"ex-transit",cat:"astrophysique",title:"La m\xE9thode des transits",sketch:"lightcurve",text:"Quand une plan\xE8te passe devant son \xE9toile, la luminosit\xE9 baisse l\xE9g\xE8rement. La baisse se r\xE9p\xE8te \xE0 chaque orbite : l\u2019intervalle donne la p\xE9riode, la profondeur donne la taille relative.",note:"Avec cette m\xE9thode, on peut en trouver des milliers. Il suffit d\u2019\xEAtre patient. Tr\xE8s patient.",formula:"\u0394F / F \u2248 (Rp / R\u2605)\xB2"},{id:"ex-hotjupiter",cat:"astrophysique",title:"Jupiter chaud",sketch:"lightcurve",text:"Une plan\xE8te g\xE9ante sur une orbite de quelques jours : transits profonds (\u2248 1 %) et fr\xE9quents. Ce sont les plus faciles \xE0 d\xE9tecter, pas forc\xE9ment les plus nombreuses.",note:"Biais d\u2019observation ! On trouve d\u2019abord ce qui est facile \xE0 trouver."},{id:"ex-false",cat:"astrophysique",title:"Pas de plan\xE8te",sketch:"noise",text:"Le bruit de mesure et l\u2019activit\xE9 de l\u2019\xE9toile font varier la courbe. Une seule baisse ne prouve rien : il faut des baisses r\xE9p\xE9t\xE9es, de m\xEAme profondeur et \xE0 intervalle r\xE9gulier.",note:"Savoir dire \xAB il n\u2019y a rien \xBB fait partie du travail."},{id:"ex-small",cat:"astrophysique",title:"Petite plan\xE8te",sketch:"lightcurve",text:"Une plan\xE8te dix fois plus petite en rayon produit une baisse cent fois plus faible. Pour la voir, on replie la courbe sur la p\xE9riode : les transits s\u2019additionnent et sortent du bruit.",note:"Replier le temps. Technique de papa pour les \xE9toiles variables aussi."},{id:"ev-supernova",cat:"astrophysique",title:"Supernova lointaine",sketch:"supernova",text:"Une supernova peut briller autant que toute une galaxie pendant quelques semaines. La derni\xE8re observ\xE9e \xE0 l\u2019\u0153il nu dans notre galaxie remonte \xE0 plusieurs si\xE8cles.",note:"Elle a explos\xE9 il y a longtemps. La lumi\xE8re arrive seulement maintenant."},{id:"ev-aurora",cat:"astrophysique",title:"Aurore",sketch:"aurora",text:"Des particules charg\xE9es venues du Soleil sont guid\xE9es par le champ magn\xE9tique de notre plan\xE8te vers les r\xE9gions polaires. En percutant l\u2019oxyg\xE8ne et l\u2019azote de la haute atmosph\xE8re, elles les font briller : vert, rouge, violet.",note:"On en voit surtout au Pays des Neiges, tout au nord. Vert = oxyg\xE8ne vers 100\u2013250 km. Rouge = oxyg\xE8ne plus haut."},{id:"mt-instruments",cat:"meteorologie",title:"Les instruments",sketch:"instruments",text:"Barom\xE8tre (pression), thermom\xE8tre (temp\xE9rature), hygrom\xE8tre (humidit\xE9), an\xE9mom\xE8tre et girouette (vent). Aucun instrument seul ne pr\xE9voit un orage : il faut croiser les mesures.",note:"Papa relevait le barom\xE8tre trois fois par jour. Je sais pourquoi maintenant."},{id:"mt-front",cat:"meteorologie",title:"Front froid",sketch:"front",text:"L\u2019air froid, plus dense, se glisse sous l\u2019air chaud et humide et le soul\xE8ve brutalement. Si l\u2019air soulev\xE9 est instable, des cumulonimbus se forment le long du front.",note:"distance / vitesse = d\xE9lai. 90 km \xE0 30 km/h \u2192 3 h.",formula:"t = d / v"},{id:"mt-anticyclone",cat:"meteorologie",title:"Anticyclone",sketch:"high",text:"Dans une haute pression, l\u2019air descend lentement et se r\xE9chauffe en se comprimant : il s\u2019ass\xE8che et emp\xEAche les nuages de se d\xE9velopper. Temps stable.",note:"Pression haute + air sec = pas d\u2019orage. Nuit parfaite pour observer."},{id:"mt-heat",cat:"meteorologie",title:"Orage de chaleur en montagne",sketch:"orographic",text:"L\u2019apr\xE8s\u2011midi, le soleil chauffe les pentes ; l\u2019air humide remonte le relief (soul\xE8vement orographique). Si l\u2019atmosph\xE8re est instable, des cumulonimbus se forment d\u2019abord au\u2011dessus des cr\xEAtes.",note:"\xC0 Kumo, on le voit presque chaque \xE9t\xE9. Les nuages naissent sur les sommets."},{id:"cb-updraft",cat:"orages",title:"Courant ascendant",sketch:"cloud-up",text:"L\u2019air chaud et humide monte. En se refroidissant, sa vapeur se condense et lib\xE8re de la chaleur, ce qui le fait monter encore plus. Dans un cumulonimbus, ces courants peuvent d\xE9passer plusieurs dizaines de km/h.",note:"Le moteur du nuage : la chaleur lib\xE9r\xE9e par la condensation."},{id:"cb-downdraft",cat:"orages",title:"Courant descendant",sketch:"cloud-down",text:"La pluie et la gr\xEAle entra\xEEnent l\u2019air vers le bas ; l\u2019\xE9vaporation le refroidit et l\u2019acc\xE9l\xE8re. En touchant le sol, il s\u2019\xE9tale en rafales froides : le front de rafales.",note:"Le coup de vent froid juste avant la pluie. Je le sentais sans comprendre."},{id:"cb-rain",cat:"orages",title:"Formation de la pluie",sketch:"cloud-rain",text:"Les gouttelettes de nuage sont minuscules. Elles grossissent par collisions, ou via des cristaux de glace qui grandissent au d\xE9triment des gouttelettes, puis fondent en tombant.",note:"Beaucoup de pluie d\u2019\xE9t\xE9 a commenc\xE9 sous forme de glace."},{id:"cb-hail",cat:"orages",title:"La gr\xEAle",sketch:"cloud-hail",text:"Dans un courant ascendant puissant, un gr\xEAlon grossit en collectant des gouttelettes surfondues (liquides sous 0 \xB0C) qui g\xE8lent \xE0 son contact. Il tombe quand il devient trop lourd pour \xEAtre soutenu.",note:"Couper un gr\xEAlon \u2192 des couches, comme un oignon."},{id:"cb-charges",cat:"orages",title:"S\xE9paration des charges",sketch:"cloud-charges",text:"Les collisions entre gr\xE9sil et petits cristaux de glace, en pr\xE9sence d\u2019eau surfondue, transf\xE8rent des charges. Les cristaux l\xE9gers montent (sommet souvent positif), le gr\xE9sil lourd reste plus bas (zone principale n\xE9gative).",note:"Mod\xE8le \xAB tripolaire \xBB simplifi\xE9 : + en haut, \u2212 au milieu, petit + en bas.",margin:"zone \u2212 vers \u221210 \xE0 \u221225 \xB0C"},{id:"cb-anvil",cat:"orages",title:"L\u2019enclume",sketch:"cloud-anvil",text:"Le courant ascendant bute contre la tropopause, o\xF9 la temp\xE9rature cesse de baisser avec l\u2019altitude. Le nuage s\u2019\xE9tale alors horizontalement en forme d\u2019enclume.",note:"Enclume = orage m\xFBr. Surveiller."},{id:"cb-strike",cat:"orages",title:"D\xE9charge pr\xE9vue",sketch:"bolt",text:"La plupart des \xE9clairs restent dans le nuage. Un \xE9clair nuage\u2011sol part le plus souvent de la zone n\xE9gative : un traceur descend par bonds, et un traceur ascendant part d\u2019un objet \xE9lev\xE9 au sol pour le rejoindre.",note:"Je l\u2019avais pr\xE9dit. Et pourtant, la foudre reste une affaire de probabilit\xE9s.",margin:"30 000 \xB0C dans le canal"},{id:"lr-rod",cat:"orages",title:"Le paratonnerre",sketch:"rod",text:"Un paratonnerre n\u2019attire pas la foudre de loin : il offre un point d\u2019impact pr\xE9f\xE9rentiel et un chemin conducteur vers la terre, ce qui prot\xE8ge une zone autour de lui.",note:"Au Pays de la Foudre, chaque tour de guet a sa tige de fer. Papa disait \xAB offrir un chemin plut\xF4t que subir \xBB.",strike:["attire","guide"]},{id:"ev-storm",cat:"orages",title:"Orage lointain",sketch:"far-storm",text:"Le son voyage \xE0 environ 340 m/s, la lumi\xE8re est quasi instantan\xE9e. Compter les secondes entre l\u2019\xE9clair et le tonnerre, puis diviser par 3, donne la distance en kilom\xE8tres.",note:"9 secondes \u2192 3 km. On compte \xE0 voix basse.",formula:"d (km) \u2248 \u0394t (s) / 3"},{id:"as-comet",cat:"astromancie",title:"Pr\xE9sage de la com\xE8te",sketch:"comet",text:"CROYANCE : les anciens astromanciens de Kumo y voyaient l\u2019annonce d\u2019un bouleversement. OBSERVATION : son retour est calculable (certaines com\xE8tes reviennent \xE0 intervalles r\xE9guliers, l\u2019une d\u2019elles environ tous les 76 ans) ; elle n\u2019a aucun lien avec les \xE9v\xE9nements humains.",note:"Un astronome a calcul\xE9 le retour d\u2019une com\xE8te. Elle est revenue \xE0 l\u2019heure dite. Le ciel a ob\xE9i \xE0 la gravitation, pas aux pr\xE9sages."},{id:"as-eclipse",cat:"astromancie",title:"Pr\xE9sage de l\u2019\xE9clipse",sketch:"eclipse",text:"CROYANCE : au Pays de l\u2019Eau, un dragon qui d\xE9vore l\u2019astre ; au Pays de la Terre, un d\xE9mon. OBSERVATION : les \xE9clipses se pr\xE9disent des si\xE8cles \xE0 l\u2019avance, gr\xE2ce aux cycles de la Lune (par exemple le cycle de saros d\u2019environ 18 ans).",note:"Ce qui se pr\xE9dit avec des calculs n\u2019a pas besoin d\u2019\xEAtre un signe."},{id:"as-mars",cat:"astromancie",title:"L\u2019astre rouge",sketch:"planet",text:"CROYANCE : astre de la guerre et de la col\xE8re. OBSERVATION : la couleur de Mars vient des oxydes de fer de sa surface ; celle d\u2019Antar\xE8s, de la faible temp\xE9rature de sa surface. M\xEAme couleur, causes diff\xE9rentes.",note:"Rouge \u2260 col\xE8re. Rouge = rouille, ou \xE9toile froide."},{id:"as-all",cat:"astromancie",title:"Croire et observer",sketch:"scale",text:"L\u2019astromancie relie le ciel au destin humain sans pouvoir le v\xE9rifier. La science formule des pr\xE9dictions qui peuvent \xE9chouer, et les teste. C\u2019est cette possibilit\xE9 d\u2019avoir tort qui fait la diff\xE9rence.",note:"Les anciens regardaient attentivement. C\u2019est d\xE9j\xE0 beaucoup. Mais regarder ne suffit pas : il faut tester."},{id:"op-glasses",cat:"perso",title:"Les lunettes de papa",sketch:"glasses",text:"Verres bleut\xE9s, monture de laiton, un r\xE9ticule grav\xE9 dans le verre gauche. Ridicules. Je les porte quand m\xEAme.",note:"Sur le front, pas sur les yeux. Comme lui, quand il r\xE9fl\xE9chissait."},{id:"op-grand",cat:"perso",title:"Le Grand Observatoire",sketch:"dome",text:"La coupole s\u2019est ouverte. Tout le ciel, d\u2019un horizon \xE0 l\u2019autre.",note:"Il y aura toujours quelque chose l\xE0\u2011haut que je ne connais pas encore."}],kn=xn.length,Ea=e=>xn.find(t=>t.id===e);var Zf=e=>440*Math.pow(2,(e-69)/12),F2=[{bass:45,pad:[57,60,64,67,71],bells:.25},{bass:41,pad:[53,57,60,64],bells:.3},{bass:36,pad:[55,60,62,64,71],bells:.35},{bass:43,pad:[55,57,62,64],bells:.3},{bass:38,pad:[50,57,60,64,65],bells:.55},{bass:41,pad:[53,57,59,64],b s temps par trois chasseurs : les trois \xE9toiles de la queue.",kagura:"Premier rep\xE8re que papa m\u2019a appris. Pointeurs \u2192 Polaire. Toujours.",dec:[49.3,61.8],main:{name:"Alioth",dec:56},saison:"printemps (toute l\u2019ann\xE9e dans les pays du nord)"},{id:"ori",name:"Orion",latin:"Orion",difficulty:2,stars:[{id:"meissa",name:"Meissa",x:48,y:9,mag:3.4},{id:"betel",name:"B\xE9telgeuse",x:29,y:22,mag:.5},{id:"bella",name:"Bellatrix",x:67,y:26,mag:1.6},{id:"alnitak",name:"Alnitak",x:42,y:53,mag:1.8},{id:"alnilam",name:"Alnilam",x:50,y:50,mag:1.7},{id:"mintaka",name:"Mintaka",x:58,y:47,mag:2.2},{id:"saiph",name:"Saiph",x:35,y:84,mag:2.1},{id:"rigel",name:"Rigel",x:71,y:81,mag:.1}],edges:[["meissa","betel"],["meissa","bella"],["betel","alnitak"],["bella","mintaka"],["alnitak","alnilam"],["alnilam","mintaka"],["alnitak","saiph"],["mintaka","rigel"]],facts:["B\xE9telgeuse est une superg\xE9ante rouge ; son \xE9clat varie. Il y a quelques ann\xE9es, elle a nettement faibli pendant plusieurs mois : ce \xAB grand obscurcissement \xBB a \xE9t\xE9 attribu\xE9 \xE0 un nuage de poussi\xE8re qu\u2019elle avait elle\u2011m\xEAme \xE9ject\xE9.","Rigel, au contraire, est une superg\xE9ante bleue : la couleur d\u2019une \xE9toile indique la temp\xE9rature de sa surface.","Sous la ceinture (Alnitak, Alnilam, Mintaka) brille la n\xE9buleuse d\u2019Orion (M42), une pouponni\xE8re d\u2019\xE9toiles situ\xE9e \xE0 environ 1 300 ann\xE9es\u2011lumi\xE8re.","Pos\xE9 sur l\u2019\xE9quateur c\xE9leste, Orion se voit depuis tous les pays shinobis, du Pays des Neiges au d\xE9sert du Pays du Vent : c\u2019est la grande constellation des soir\xE9es d\u2019hiver."],myth:"Pour les caravaniers du Pays du Vent, c\u2019est le Chasseur des dunes : un g\xE9ant qui se vantait de pouvoir tuer toutes les b\xEAtes du d\xE9sert. Un scorpion des sables le piqua au talon. Depuis, le Chasseur et le Scorpion sont plac\xE9s aux deux bouts du ciel : quand le Scorpion se l\xE8ve, le Chasseur se couche.",k
